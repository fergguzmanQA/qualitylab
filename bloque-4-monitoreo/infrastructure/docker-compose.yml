version: '3.8'

services:
  # 1. Base de datos de series temporales para recolectar métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: portfolio_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring_network

  # 2. Panel visual para analizar los cuellos de botella en tiempo real
  grafana:
    image: grafana/grafana:latest
    container_name: portfolio_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring_network

networks:
  monitoring_network:
    driver: bridge
